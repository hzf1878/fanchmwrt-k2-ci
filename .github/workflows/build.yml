name: 编译斐讯 K2 固件

# 同设备同时只跑一个，新任务排队等待而不是取消旧的。
# 注意不要用 cancel-in-progress: true —— 一次编译要一小时，
# 中途取消等于白跑，而且会让「上一轮为什么失败」无从追查。
concurrency:
  group: build-k2-${{ github.event.inputs.device || github.ref_name }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      device:
        description: '目标设备（8M 原装 / 16M 换芯 / 32M 换芯）'
        required: true
        default: 'k2-8m'
        type: choice
        options:
          - k2-8m
          - k2-16m
          - k2-32m
      use_cache:
        description: '使用编译缓存：源码包 + ccache，省约 55 分钟'
        required: true
        default: true
        type: boolean
      use_ccache:
        description: '仅使用 ccache（编译中间产物），省约 35 分钟'
        required: true
        default: true
        type: boolean
      with_xray:
        description: '加入 xray-core（trojan/VMess/VLESS/SS，占约 3.5MB）。16M/32M 可用，8M 空间不足会自动关闭'
        required: true
        default: false
        type: boolean
      with_ssrplus:
        description: '加入 luci-app-ssr-plus 图形界面（自动带 xray，占约 9MB）。仅 32M 可用；16M 勾选会同时关闭 xray 和 ssr-plus'
        required: true
        default: false
        type: boolean
      with_ss_full:
        description: '额外加入 Shadowsocks / ShadowsocksR 内核（需 with_ssrplus + 32M，约 7MB，首次编译 Rust 多约 50 分钟）'
        required: true
        default: false
        type: boolean
      keep_sfe:
        description: '保留 SFE 加速（默认关闭）。SFE 会绕过 netfilter 使 TPROXY 失效，且无法按端口/mark 排除，跑代理必须关闭'
        required: true
        default: false
        type: boolean
      with_hnat:
        description: '加入 HNAT/fastnat 加速界面（默认关闭）。MT7620A 无硬件引擎，实际是 SFE+flowtable 软件快速路径'
        required: true
        default: false
        type: boolean
      with_ttyd:
        description: 'Web 终端 ttyd（浏览器里打开命令行，约 470KB）'
        required: true
        default: false
        type: boolean
      with_wol:
        description: '网络唤醒 WOL（远程开机局域网设备，约 18KB）'
        required: true
        default: false
        type: boolean
      with_wifischedule:
        description: 'WiFi 定时开关（按时间段自动开关无线，约 6KB）'
        required: true
        default: false
        type: boolean
      with_advreboot:
        description: '一键重启进 Breed（免按复位键，约 13KB）'
        required: true
        default: false
        type: boolean
      with_upnp:
        description: 'UPnP 端口自动映射（内网设备自动开端口，约 160KB）'
        required: true
        default: false
        type: boolean
      with_filebrowser:
        description: 'FileBrowser 文件管理（网页版文件管理器，仅界面约 1KB，无二进制）'
        required: true
        default: false
        type: boolean
      with_ftp:
        description: 'FTP 共享 vsftpd（共享 U 盘/存储，约 140KB。需自建账号并放行 21 与 50000-50100）'
        required: true
        default: false
        type: boolean
      with_usb:
        description: '启用 USB 2.0（仅限已焊接 USB 口的改装机，需配合 k2-32m 的 DTS，约 1MB）'
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

env:
  REPO_URL: https://github.com/fanchmwrt/fanchmwrt.git
  REPO_BRANCH: fanchmwrt-25.12.6
  TZ: Asia/Shanghai
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build parameters
        id: params
        run: |
          DEVICE="${{ github.event.inputs.device }}"
          if [ -z "$DEVICE" ]; then
            # tag 触发不带 inputs，用 tag 名决定设备：v32-* / v8-* / v16-*
            REF="${GITHUB_REF#refs/tags/}"
            case "$REF" in
              v32*) DEVICE="k2-32m" ;;
              v8-*) DEVICE="k2-8m" ;;
              *)    DEVICE="k2-16m" ;;
            esac
            echo "tag 触发：$REF -> $DEVICE"
          fi
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          CFG_HASH=$(sha256sum "config/$DEVICE.config" | cut -c1-16)
          echo "cfg_hash=$CFG_HASH" >> "$GITHUB_OUTPUT"

          # use_cache 总开关（未提供时默认 true，tag 触发也走缓存）
          USE_CACHE="${{ github.event.inputs.use_cache }}"
          if [ -z "$USE_CACHE" ]; then USE_CACHE="true"; fi
          # use_ccache 细粒度开关
          USE_CCACHE="${{ github.event.inputs.use_ccache }}"
          if [ -z "$USE_CCACHE" ]; then USE_CCACHE="$USE_CACHE"; fi
          # 总开关关闭时，ccache 也强制关闭
          if [ "$USE_CACHE" != "true" ]; then USE_CCACHE="false"; fi

          echo "use_cache=$USE_CACHE" >> "$GITHUB_OUTPUT"
          echo "use_ccache=$USE_CCACHE" >> "$GITHUB_OUTPUT"
          # 下载缓存依赖总开关
          if [ "$USE_CACHE" = "true" ]; then
            echo "use_dl=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_dl=false" >> "$GITHUB_OUTPUT"
          fi

          # xray：默认不装
          WITH_XRAY="${{ github.event.inputs.with_xray }}"
          if [ -z "$WITH_XRAY" ]; then WITH_XRAY="false"; fi

          WITH_SSRPLUS="${{ github.event.inputs.with_ssrplus }}"
          if [ -z "$WITH_SSRPLUS" ]; then WITH_SSRPLUS="false"; fi

          WITH_SS_FULL="${{ github.event.inputs.with_ss_full }}"
          if [ -z "$WITH_SS_FULL" ]; then WITH_SS_FULL="false"; fi

          KEEP_SFE="${{ github.event.inputs.keep_sfe }}"
          if [ -z "$KEEP_SFE" ]; then KEEP_SFE="false"; fi

          WITH_HNAT="${{ github.event.inputs.with_hnat }}"
          if [ -z "$WITH_HNAT" ]; then WITH_HNAT="false"; fi

          WITH_TTYD="${{ github.event.inputs.with_ttyd }}"
          if [ -z "$WITH_TTYD" ]; then WITH_TTYD="false"; fi

          WITH_WOL="${{ github.event.inputs.with_wol }}"
          if [ -z "$WITH_WOL" ]; then WITH_WOL="false"; fi

          WITH_WIFISCHEDULE="${{ github.event.inputs.with_wifischedule }}"
          if [ -z "$WITH_WIFISCHEDULE" ]; then WITH_WIFISCHEDULE="false"; fi

          WITH_ADVREBOOT="${{ github.event.inputs.with_advreboot }}"
          if [ -z "$WITH_ADVREBOOT" ]; then WITH_ADVREBOOT="false"; fi

          WITH_UPNP="${{ github.event.inputs.with_upnp }}"
          if [ -z "$WITH_UPNP" ]; then WITH_UPNP="false"; fi

          WITH_FILEBROWSER="${{ github.event.inputs.with_filebrowser }}"
          if [ -z "$WITH_FILEBROWSER" ]; then WITH_FILEBROWSER="false"; fi

          WITH_FTP="${{ github.event.inputs.with_ftp }}"
          if [ -z "$WITH_FTP" ]; then WITH_FTP="false"; fi

          WITH_USB="${{ github.event.inputs.with_usb }}"
          if [ -z "$WITH_USB" ]; then WITH_USB="false"; fi

          # USB 只有 k2-32m 的 DTS 启用了 &ehci / &ohci
          if [ "$WITH_USB" = "true" ] && [ "$DEVICE" != "k2-32m" ]; then
            echo "::warning title=USB 仅 k2-32m 支持::$DEVICE 的 DTS 未启用 ehci/ohci，已强制关闭 with_usb。"
            WITH_USB="false"
          fi

          # 8M 可写区仅 320KB，什么都加不了
          if [ "$DEVICE" = "k2-8m" ]; then
            if [ "$WITH_TTYD" = "true" ] || [ "$WITH_WOL" = "true" ] \
               || [ "$WITH_WIFISCHEDULE" = "true" ] || [ "$WITH_ADVREBOOT" = "true" ] \
               || [ "$WITH_UPNP" = "true" ] || [ "$WITH_FILEBROWSER" = "true" ] \
               || [ "$WITH_FTP" = "true" ]; then
              echo "::warning title=8M 空间不足::k2-8m 可写区仅 320KB，已强制关闭全部可选组件。"
              WITH_TTYD="false"
              WITH_WOL="false"
              WITH_WIFISCHEDULE="false"
              WITH_ADVREBOOT="false"
              WITH_UPNP="false"
              WITH_FILEBROWSER="false"
              WITH_FTP="false"
            fi
          fi

          # 8M：两个都装不下，强制关闭
          if [ "$DEVICE" = "k2-8m" ]; then
            if [ "$WITH_XRAY" = "true" ]; then
              echo "::warning::xray-core 二进制 4.3MB，k2-8m 可写区仅 320KB，已强制关闭"
              WITH_XRAY="false"
            fi
            if [ "$WITH_SSRPLUS" = "true" ]; then
              echo "::warning::luci-app-ssr-plus 需 xray 且总增量约 9MB，k2-8m 放不下，已强制关闭"
              WITH_SSRPLUS="false"
            fi
          fi

          # ssr-plus 依赖 xray
          if [ "$WITH_SSRPLUS" = "true" ] && [ "$WITH_XRAY" != "true" ]; then
            echo "with_ssrplus 需要 xray-core，自动开启 with_xray"
            WITH_XRAY="true"
          fi

          # fastnat 面板依赖 SFE 内核模块。若装了 ssr-plus 且 keep_sfe=false，
          # configure_ssrplus.py 会关掉 kmod-shortcut-fe，此时面板没有可管的模块
          if [ "$WITH_HNAT" = "true" ] && [ "$WITH_SSRPLUS" = "true" ] && [ "$KEEP_SFE" != "true" ]; then
            echo "::warning title=fastnat 面板将无内核模块可管::已装 ssr-plus 且 keep_sfe=false，SFE 会被关闭。with_hnat 仍保留面板，但其中的 SFE 开关不可用；如需完整加速请勾选 keep_sfe。"
          fi

          # with_ss_full 依赖 with_ssrplus（内核无法单独使用）
          if [ "$WITH_SS_FULL" = "true" ] && [ "$WITH_SSRPLUS" != "true" ]; then
            echo "with_ss_full 需要 ssr-plus 界面，已自动关闭"
            WITH_SS_FULL="false"
          fi
          # 仅 32M 放得下 SS/SSR 内核
          if [ "$WITH_SS_FULL" = "true" ] && [ "$DEVICE" != "k2-32m" ]; then
            echo "::warning title=SS/SSR 内核仅 32M 可用::$DEVICE 分区放不下约 7MB 的 SS/SSR 内核，已强制关闭 with_ss_full。"
            WITH_SS_FULL="false"
          fi

          # 16M：按实测体积算账，装不下就强制关闭（不中断编译）
          if [ "$DEVICE" = "k2-16m" ]; then
            FW_MAX=16449536          # 0xfb0000
            BASE_IMG=11469641        # 空固件 sysupgrade
            XRAY_ADD=3670016         # xray ~3.5MB
            SSRPLUS_ADD=6160000      # ssr-plus 其余部分 ~5.9MB
            # 以下均为实测体积（2026-11-12 从 #12 固件 ROM 分区量取），
            # 含 luci 界面 + i18n + uci-defaults + 后端二进制。
            TTYD_ADD=479000          # with_ttyd  ttyd 二进制 475KB + 界面 3KB
            WOL_ADD=18000            # with_wol   etherwake 9.4KB + 界面 8.5KB
            WIFISCHED_ADD=6000       # with_wifischedule 纯脚本，无二进制
            ADVREBOOT_ADD=13000      # with_advreboot   纯脚本，无二进制
            UPNP_ADD=164000          # with_upnp  miniupnpd 154KB + 界面 10KB
            FILEBROWSER_ADD=1100     # with_filebrowser 只有界面，无二进制
            FTP_ADD=145000           # with_ftp  vsftpd 二进制 132KB + 配置

            # ssr-plus 在 16M 上无解：连同 xray 一起关掉，不做半吊子降级
            if [ "$WITH_SSRPLUS" = "true" ]; then
              NEED=$((BASE_IMG + XRAY_ADD + SSRPLUS_ADD))
              echo "=== 16M 空间预算 ==="
              echo "分区上界   : $FW_MAX"
              echo "预计镜像   : $NEED"
              echo "超出       : $((NEED - FW_MAX))"
              echo "::warning title=16M 装不下 ssr-plus::预计镜像 $NEED 字节 > 上界 $FW_MAX 字节（超 $((NEED - FW_MAX))）。已同时关闭 with_ssrplus 与 with_xray，编出的是基础固件。要图形代理请用 device=k2-32m。"
              WITH_SSRPLUS="false"
              WITH_XRAY="false"
              WITH_SS_FULL="false"
              echo "调整后：with_xray=false with_ssrplus=false with_ss_full=false"
            else
              # 没勾 ssr-plus 时，把其余可选项累加后校验
              NEED=$BASE_IMG
              [ "$WITH_XRAY" = "true" ] && NEED=$((NEED + XRAY_ADD))
              [ "$WITH_TTYD" = "true" ] && NEED=$((NEED + TTYD_ADD))
              [ "$WITH_WOL" = "true" ] && NEED=$((NEED + WOL_ADD))
              [ "$WITH_WIFISCHEDULE" = "true" ] && NEED=$((NEED + WIFISCHED_ADD))
              [ "$WITH_ADVREBOOT" = "true" ] && NEED=$((NEED + ADVREBOOT_ADD))
              [ "$WITH_UPNP" = "true" ] && NEED=$((NEED + UPNP_ADD))
              [ "$WITH_FILEBROWSER" = "true" ] && NEED=$((NEED + FILEBROWSER_ADD))
              [ "$WITH_FTP" = "true" ] && NEED=$((NEED + FTP_ADD))

              echo "=== 16M 空间预算 ==="
              echo "分区上界   : $FW_MAX"
              echo "预计镜像   : $NEED"
              echo "余量       : $((FW_MAX - NEED))"

              if [ "$NEED" -gt "$FW_MAX" ]; then
                # 按实测体积从大到小依次放弃
                if [ "$NEED" -gt "$FW_MAX" ] && [ "$WITH_XRAY" = "true" ]; then
                  echo "::warning title=16M 装不下 xray::已强制关闭 with_xray（约 3.5MB）"
                  WITH_XRAY="false"
                  NEED=$((NEED - XRAY_ADD))
                fi
                if [ "$NEED" -gt "$FW_MAX" ] && [ "$WITH_TTYD" = "true" ]; then
                  echo "::warning title=16M 装不下 ttyd::已强制关闭 with_ttyd（约 468KB）"
                  WITH_TTYD="false"
                  NEED=$((NEED - TTYD_ADD))
                fi
                if [ "$NEED" -gt "$FW_MAX" ] && [ "$WITH_UPNP" = "true" ]; then
                  echo "::warning title=16M 装不下 upnp::已强制关闭 with_upnp（约 160KB）"
                  WITH_UPNP="false"
                  NEED=$((NEED - UPNP_ADD))
                fi
                echo "调整后：xray=$WITH_XRAY ttyd=$WITH_TTYD wol=$WITH_WOL wifischedule=$WITH_WIFISCHEDULE advreboot=$WITH_ADVREBOOT upnp=$WITH_UPNP filebrowser=$WITH_FILEBROWSER"
              fi
            fi
          fi

          echo "with_xray=$WITH_XRAY" >> "$GITHUB_OUTPUT"
          echo "with_ssrplus=$WITH_SSRPLUS" >> "$GITHUB_OUTPUT"
          echo "with_ss_full=$WITH_SS_FULL" >> "$GITHUB_OUTPUT"
          echo "keep_sfe=$KEEP_SFE" >> "$GITHUB_OUTPUT"
          echo "with_hnat=$WITH_HNAT" >> "$GITHUB_OUTPUT"
          echo "with_ttyd=$WITH_TTYD" >> "$GITHUB_OUTPUT"
          echo "with_wol=$WITH_WOL" >> "$GITHUB_OUTPUT"
          echo "with_wifischedule=$WITH_WIFISCHEDULE" >> "$GITHUB_OUTPUT"
          echo "with_advreboot=$WITH_ADVREBOOT" >> "$GITHUB_OUTPUT"
          echo "with_upnp=$WITH_UPNP" >> "$GITHUB_OUTPUT"
          echo "with_filebrowser=$WITH_FILEBROWSER" >> "$GITHUB_OUTPUT"
          echo "with_ftp=$WITH_FTP" >> "$GITHUB_OUTPUT"
          echo "with_usb=$WITH_USB" >> "$GITHUB_OUTPUT"

          echo "Device        : $DEVICE"
          echo "Config hash   : $CFG_HASH"
          echo "use_cache     : $USE_CACHE"
          echo "use_dl        : $([ "$USE_CACHE" = "true" ] && echo true || echo false)"
          echo "use_ccache    : $USE_CCACHE"
          echo "with_xray     : $WITH_XRAY"
          echo "with_ssrplus  : $WITH_SSRPLUS"
          echo "with_ss_full  : $WITH_SS_FULL"
          echo "keep_sfe      : $KEEP_SFE"
          echo "with_hnat     : $WITH_HNAT"
          echo "with_ttyd     : $WITH_TTYD"
          echo "with_wol      : $WITH_WOL"
          echo "with_wifischedule : $WITH_WIFISCHEDULE"
          echo "with_advreboot: $WITH_ADVREBOOT"
          echo "with_upnp     : $WITH_UPNP"
          echo "with_filebrowser : $WITH_FILEBROWSER"
          echo "with_ftp      : $WITH_FTP"
          echo "with_usb      : $WITH_USB"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache ecj fastjar file g++ gawk gettext git \
            java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev \
            libssl-dev python3 python3-setuptools python3-dev \
            rsync subversion swig time xsltproc zlib1g-dev unzip wget

      - name: Clone upstream source
        run: |
          git clone --depth=1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          echo "Upstream commit: $(git log --oneline -1)"

      # ---- 缓存 1：下载的软件包源码（省 ~20 分钟）----
      - name: Restore download cache
        id: cache-dl
        if: steps.params.outputs.use_dl == 'true'
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl
          key: dl-${{ steps.params.outputs.device }}-${{ steps.params.outputs.cfg_hash }}
          restore-keys: |
            dl-${{ steps.params.outputs.device }}-
            dl-

      # ---- 缓存 2：ccache 编译缓存（省 ~35 分钟）----
      # 注意：OpenWrt 默认把 ccache 放在 $(TOPDIR)/.ccache，即 openwrt/.ccache
      - name: Restore ccache
        id: cache-ccache
        if: steps.params.outputs.use_ccache == 'true'
        uses: actions/cache/restore@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ steps.params.outputs.device }}-${{ steps.params.outputs.cfg_hash }}
          restore-keys: |
            ccache-${{ steps.params.outputs.device }}-
            ccache-

      - name: Cache status
        run: |
          echo "=== Cache switch ==="
          echo "use_cache  : ${{ steps.params.outputs.use_cache }}"
          echo "use_dl     : ${{ steps.params.outputs.use_dl }}"
          echo "use_ccache : ${{ steps.params.outputs.use_ccache }}"
          echo
          if [ "${{ steps.params.outputs.use_dl }}" = "true" ]; then
            echo "dl cache hit     : ${{ steps.cache-dl.outputs.cache-hit }}"
            du -sh openwrt/dl 2>/dev/null || echo "dl: empty"
          else
            echo "dl cache         : disabled"
          fi
          if [ "${{ steps.params.outputs.use_ccache }}" = "true" ]; then
            echo "ccache cache hit : ${{ steps.cache-ccache.outputs.cache-hit }}"
            du -sh openwrt/.ccache 2>/dev/null || echo "ccache: empty"
          else
            echo "ccache cache     : disabled"
          fi

      - name: Apply custom patches
        run: |
          cd openwrt
          cp ../patches/mt7620a_phicomm_k2-16m.dts target/linux/ramips/dts/
          cp ../patches/mt7620a_phicomm_k2-32m.dts target/linux/ramips/dts/
          python3 ../scripts/register_device.py
          echo "=== registered devices ==="
          grep -E "define Device/phicomm_k2-(16m|32m)" target/linux/ramips/image/mt7620.mk

      - name: Add third-party feeds
        run: |
          cd openwrt
          if [ "${{ steps.params.outputs.with_ssrplus }}" = "true" ]; then
            # xray-core 由 openwrt/packages 提供，helloworld 里的同名包会造成冲突
            # 只取其 luci-app-ssr-plus 及必要依赖，剔除其自带的 xray-core
            echo "src-git helloworld https://github.com/fw876/helloworld.git" >> feeds.conf.default
            echo "=== feeds.conf.default ==="
            cat feeds.conf.default
          else
            echo "ssr-plus disabled, skip extra feed"
          fi

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          if [ "${{ steps.params.outputs.with_ssrplus }}" = "true" ]; then
            # helloworld 也带 xray-core，与 feeds/packages 的同名包冲突，
            # 会导致 "package/feeds/packages/xray-core failed to build"。
            # 这里剔除 helloworld 版本，保留 openwrt/packages 的。
            echo "=== 移除 helloworld 的冲突包 ==="
            for pkg in xray-core v2ray-core v2raya luci-app-v2raya; do
              if [ -e "package/feeds/helloworld/$pkg" ]; then
                rm -rf "package/feeds/helloworld/$pkg"
                echo "  removed package/feeds/helloworld/$pkg"
              fi
              if [ -e "feeds/helloworld/$pkg" ]; then
                rm -rf "feeds/helloworld/$pkg"
                echo "  removed feeds/helloworld/$pkg"
              fi
            done

            echo "=== ssr-plus 是否可装 ==="
            ./scripts/feeds list -n 2>/dev/null | grep -i "ssr-plus" || echo "未找到 ssr-plus"
            echo "=== 确认 xray-core 来源 ==="
            ls -d package/feeds/*/xray-core 2>/dev/null || echo "无 xray-core 目录"
          fi

      - name: Load build config
        run: |
          cd openwrt
          cp ../config/${{ steps.params.outputs.device }}.config .config

          # ccache 需要 CONFIG_DEVEL=y，否则 config CCACHE 的 "if DEVEL" 条件不成立
          # 该选项会被 defconfig 直接丢弃，ccache 完全不会生效
          sed -i '/^CONFIG_CCACHE=/d' .config
          sed -i '/^# CONFIG_CCACHE is not set/d' .config
          sed -i '/^CONFIG_DEVEL=/d' .config
          sed -i '/^# CONFIG_DEVEL is not set/d' .config
          if [ "${{ steps.params.outputs.use_ccache }}" = "true" ]; then
            echo 'CONFIG_DEVEL=y' >> .config
            echo 'CONFIG_CCACHE=y' >> .config
            echo "ccache: enabled (with CONFIG_DEVEL)"
          else
            echo '# CONFIG_DEVEL is not set' >> .config
            echo '# CONFIG_CCACHE is not set' >> .config
            echo "ccache: disabled"
          fi

          # xray-core 开关
          sed -i '/^CONFIG_PACKAGE_xray-core=/d' .config
          sed -i '/^# CONFIG_PACKAGE_xray-core is not set/d' .config
          # helloworld 的 xray 已剔除，确保只留 feeds/packages 的
          sed -i '/^CONFIG_PACKAGE_xray-plugin=/d' .config
          echo '# CONFIG_PACKAGE_xray-plugin is not set' >> .config
          if [ "${{ steps.params.outputs.with_xray }}" = "true" ]; then
            echo 'CONFIG_PACKAGE_xray-core=y' >> .config
            echo "xray-core: enabled"
          else
            echo '# CONFIG_PACKAGE_xray-core is not set' >> .config
            echo "xray-core: disabled"
          fi

          # ssr-plus 与 feeds 管理
          # keep_sfe 无论是否装 ssr-plus 都要传给脚本：SFE 是全局开关
          KEEP_SFE_ARG=""
          if [ "${{ steps.params.outputs.keep_sfe }}" = "true" ]; then
            KEEP_SFE_ARG="--keep-sfe"
          fi
          if [ "${{ steps.params.outputs.with_ssrplus }}" = "true" ]; then
            python3 ../scripts/configure_ssrplus.py enable $KEEP_SFE_ARG
          else
            python3 ../scripts/configure_ssrplus.py disable $KEEP_SFE_ARG
          fi

          # SS/SSR 内核：必须在 configure_ssrplus.py 之后执行，
          # 否则会被它 INCLUDE_OFF 里的 Shadowsocks 项覆盖回关闭
          if [ "${{ steps.params.outputs.with_ss_full }}" = "true" ]; then
            python3 ../scripts/configure_ss_full.py enable
          else
            python3 ../scripts/configure_ss_full.py disable
          fi

          # HNAT/fastnat 界面：必须在 configure_ssrplus.py 之后执行，
          # 后者在关 SFE 时会一并关掉 luci-app-fwx-fastnat
          if [ "${{ steps.params.outputs.with_hnat }}" = "true" ]; then
            python3 ../scripts/configure_fastnat.py enable
          else
            python3 ../scripts/configure_fastnat.py disable
          fi

          # 可选组件（逐项独立开关）
          echo "=== 可选组件 ==="
          for item in ttyd wol wifischedule advreboot upnp filebrowser ftp; do
            FLAG="with_${item}"
            VAL="${{ steps.params.outputs.with_ttyd }}"
            case "$item" in
              ttyd)         VAL="${{ steps.params.outputs.with_ttyd }}" ;;
              wol)          VAL="${{ steps.params.outputs.with_wol }}" ;;
              wifischedule) VAL="${{ steps.params.outputs.with_wifischedule }}" ;;
              advreboot)    VAL="${{ steps.params.outputs.with_advreboot }}" ;;
              upnp)         VAL="${{ steps.params.outputs.with_upnp }}" ;;
              filebrowser)  VAL="${{ steps.params.outputs.with_filebrowser }}" ;;
              ftp)          VAL="${{ steps.params.outputs.with_ftp }}" ;;
            esac
            if [ "$VAL" = "true" ]; then
              python3 ../scripts/configure_tools.py "$item" enable
            else
              python3 ../scripts/configure_tools.py "$item" disable
            fi
          done

          # USB 2.0（仅改装机）
          if [ "${{ steps.params.outputs.with_usb }}" = "true" ]; then
            python3 ../scripts/configure_usb.py enable
          else
            python3 ../scripts/configure_usb.py disable
          fi

          # 包管理器校验：25.12 起官方源只发 apk 格式（packages.adb + index.json），
          # 不再提供 .ipk 和 Packages.gz。固件必须带 apk，否则装不了任何软件包。
          echo "=== 包管理器校验 ==="
          if grep -qE '^CONFIG_PACKAGE_apk-mbedtls=y' .config; then
            echo "  apk-mbedtls = ON（对接官方 apk 源）"
          else
            echo "::error title=缺少包管理器::未启用 apk-mbedtls，固件将无法安装任何软件包（25.12 官方源只发 apk 格式）"
            exit 1
          fi
          if grep -qE '^CONFIG_PACKAGE_opkg=y' .config; then
            echo "::warning title=opkg 与 apk 并存::25.12 官方源已停止发布 opkg 格式，opkg 装不了任何包，建议关闭"
          fi

          make defconfig
          echo "=== Target ==="
          grep -E '^CONFIG_TARGET_PROFILE' .config
          echo "=== ccache ==="
          grep -E '^CONFIG_CCACHE' .config || echo "CONFIG_CCACHE not set"
          echo "=== xray ==="
          grep -E '^CONFIG_PACKAGE_xray-core' .config || echo "xray-core not in config"
          echo "=== ssr-plus ==="
          grep -E '^CONFIG_PACKAGE_luci-app-ssr-plus' .config || echo "ssr-plus not in config"

          echo "=== SS/SSR 内核 ==="
          for p in shadowsocks-rust-sslocal shadowsocksr-libev-ssr-redir shadowsocksr-libev-ssr-local; do
            if grep -qE "^CONFIG_PACKAGE_$p=y" .config; then
              echo "  $p = ON"
            else
              echo "  $p = off"
            fi
          done

          echo "=== 小工具 / 附加 ==="
          for p in luci-app-ttyd luci-app-wol luci-app-wifischedule \
                   luci-app-advanced-reboot luci-app-upnp luci-app-filebrowser; do
            if grep -qE "^CONFIG_PACKAGE_$p=y" .config; then
              echo "  $p = ON"
            fi
          done

          echo "=== HNAT/SFE 加速 ==="
          for p in kmod-shortcut-fe kmod-nf-flow kmod-nft-offload luci-app-fwx-fastnat; do
            if grep -qE "^CONFIG_PACKAGE_$p=y" .config; then
              echo "  $p = ON"
            else
              echo "  $p = off"
            fi
          done

          echo "=== 体积相关的包（defconfig 之后）==="
          for p in mihomo hysteria naiveproxy shadowsocks-rust shadowsocks-libev \
                   shadowsocksr-libev mosdns chinadns-ng dnsproxy tuic-client upx \
                   v2raya xray-plugin v2ray-core v2ray-plugin simple-obfs redsocks2 \
                   shadow-tls dns2socks dns2socks-rust ipt2socks-rs gn tcping; do
            if grep -qE "^CONFIG_PACKAGE_$p=y" .config; then
              echo "  $p = ON"
            fi
          done
          echo "=== 上面若出现 ON，说明它会被编入固件 ==="

          ccache --version | head -1

      - name: Download package sources
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s
          find dl -size -1024c -exec rm -f {} \;
          echo "download dir: $(du -sh dl | cut -f1)"

      # Go 包（xray-core）的模块缓存经常不自洽：dl/go-mod-cache 里
      # 有的模块是新版本，但主模块 go.mod 没声明拆分出去的子模块，
      # 于是 go 报 "no required module provides package ..."。
      # 典型：google.golang.org/protobuf@v1.36.11 里的
      # internal/editiondefaults / internal/editionssupport 已成为
      # 独立模块；sagernet/sing 的 common/debug、utls 的 internal/boring
      # 同理。这里在编译前用 -mod=mod 让 go 自己补齐依赖，
      # 并把缺失的模块真正下载进缓存。
      - name: Fix Go module cache (xray-core)
        run: |
          cd openwrt
          XRAY=feeds/packages/net/xray-core

          if [ ! -d "$XRAY" ]; then
            echo "没有 xray-core 目录，跳过"
            exit 0
          fi

          # Go 工具链位置在不同 openwrt 版本里不一样，逐个探测。
          # 之前硬编码 staging_dir/hostpkg/lib/go-1.26/bin 找不到，
          # 导致整个步骤被静默跳过（#27 就是这种情况）。
          GO_BIN=""
          for c in \
            staging_dir/hostpkg/bin/go \
            staging_dir/hostpkg/go/bin/go \
            staging_dir/hostpkg/lib/go-*/bin/go \
            staging_dir/host/bin/go \
            staging_dir/host/go/bin/go \
            staging_dir/host/lib/go-*/bin/go \
            staging_dir/target-*/go/bin/go ; do
            if [ -x "$c" ]; then GO_BIN="$c"; break; fi
          done
          if [ -z "$GO_BIN" ]; then
            GO_BIN=$(find staging_dir -maxdepth 5 -type f -name go -perm -u+x 2>/dev/null | head -1)
          fi
          if [ -z "$GO_BIN" ]; then
            echo "::error title=找不到 go 工具链::xray-core 无法修复，构建很可能再次失败"
            echo "staging_dir 下 go 相关路径："
            find staging_dir -maxdepth 4 -name "go*" 2>/dev/null | head -20
            exit 1
          fi
          export PATH="$(dirname "$GO_BIN"):$PATH"
          echo "使用 go: $GO_BIN"

          export GO_MOD_CACHE_DIR="$PWD/dl/go-mod-cache"
          export GO_BUILD_CACHE_DIR="$PWD/tmp/go-build"
          export GOMODCACHE="$GO_MOD_CACHE_DIR"
          export GOCACHE="$GO_BUILD_CACHE_DIR"
          export GOPATH="$PWD/tmp/gopath"
          export GOFLAGS="-mod=mod"
          export GOPROXY="${GOPROXY:-https://proxy.golang.org,direct}"
          export GOSUMDB=off
          mkdir -p "$GOMODCACHE" "$GOCACHE" "$GOPATH"

          echo "=== go 版本 ==="
          go version

          echo "=== 修复前：go mod verify ==="
          ( cd "$XRAY" && go mod tidy 2>&1 | tail -30 ) || true

          echo "=== 强制下载全部依赖到缓存 ==="
          ( cd "$XRAY" && go mod download all 2>&1 | tail -20 ) || true

          echo "=== 校验关键包是否已可解析 ==="
          for m in google.golang.org/protobuf/internal/editiondefaults \
                   github.com/sagernet/sing/common/debug \
                   github.com/refraction-networking/utls/internal/boring; do
            if [ -d "$GOMODCACHE/${m%@*}" ] || ls -d "$GOMODCACHE"/*"${m%%/*}"* >/dev/null 2>&1; then
              :
            fi
          done

          echo "=== 修复后：go list 检查 xray 主包 ==="
          ( cd "$XRAY" && go list ./... 2>&1 | tail -30 ) || true

          echo "=== go-mod-cache 体积 ==="
          du -sh "$GOMODCACHE" 2>/dev/null || true

          # 真正决定成败的检查：能否把缺失的子模块解析出来。
          # 这些包名来自 #24 / #25 的报错，缺一个 xray 就编不过。
          echo "=== 关键缺失包解析检查 ==="
          MISSING=0
          for p in \
            google.golang.org/protobuf/internal/editiondefaults \
            google.golang.org/protobuf/internal/editionssupport \
            github.com/sagernet/sing/common/debug \
            github.com/sagernet/sing/common/auth \
            github.com/sagernet/sing/common/logger \
            github.com/refraction-networking/utls/internal/helper \
            github.com/refraction-networking/utls/internal/hkdf ; do
            if ( cd "$XRAY" && go list "$p" >/dev/null 2>&1 ); then
              echo "  OK      $p"
            else
              echo "  MISSING $p"
              MISSING=$((MISSING+1))
            fi
          done
          echo "缺失数量: $MISSING / 7"
          if [ "$MISSING" -gt 0 ]; then
            echo "::warning title=部分 Go 依赖仍未补齐::$MISSING 个包无法解析，xray 可能仍会失败。详见本步骤日志。"
            ( cd "$XRAY" && go list ./... 2>&1 | head -30 ) || true
          else
            echo "=== 全部依赖可解析，xray 应该能编过 ==="
          fi

      - name: Compile firmware
        run: |
          cd openwrt

          # 强制重建 rootfs 与镜像，避免 build_dir 残留导致镜像字节不变
          rm -rf build_dir/target-*/root-*/
          rm -rf build_dir/target-*/linux-*/root.squashfs*
          rm -rf build_dir/target-*/linux-*/tmp
          rm -rf build_dir/target-*/linux-*/*-kernel.bin
          rm -rf bin/targets/ramips/mt7620/*.bin
          rm -rf bin/targets/ramips/mt7620/*.manifest
          echo "=== cleaned rootfs artifacts ==="

          # 上游在 CONFIG_EXPERT=y 下会丢掉 CONFIG_PRINTK，
          # 导致内核编出来 dmesg 全空、/proc/kmsg 不存在。
          # 这里强制写回，确保内核日志可用。
          echo "=== forcing CONFIG_PRINTK ==="
          for f in target/linux/generic/config-6.12 \
                   target/linux/ramips/config-6.12 \
                   target/linux/ramips/mt7620/config-6.12; do
            if [ -f "$f" ]; then
              sed -i '/^# CONFIG_PRINTK is not set/d' "$f"
              sed -i '/^CONFIG_PRINTK=/d' "$f"
              sed -i '/^# CONFIG_LOG_BUF_SHIFT is not set/d' "$f"
              sed -i '/^CONFIG_LOG_BUF_SHIFT=/d' "$f"
              printf 'CONFIG_PRINTK=y\nCONFIG_LOG_BUF_SHIFT=17\n' >> "$f"
              echo "  patched $f"
            fi
          done

          # 编译：失败时把真实错误写进 job summary，避免只能拿到 403 的日志接口。
          # 注意必须保留失败退出码，二次 make 成功也不能掩盖首轮错误。
          set +e
          make -j$(nproc) 2>&1 | tee /tmp/build1.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "=== 首轮编译失败 (rc=$rc)，重试 -j1 V=s 以定位包 ==="
            make -j1 V=s 2>&1 | tee /tmp/build2.log
            rc2=${PIPESTATUS[0]}
            {
              echo "## 编译失败诊断"
              echo ""
              echo "\`\`\`"
              grep -aiE "ERROR: package|failed to build|Error [0-9]+|\*\*\* \[" /tmp/build1.log /tmp/build2.log 2>/dev/null | tail -60
              echo "\`\`\`"
              echo ""
              echo "### 末尾 120 行"
              echo "\`\`\`"
              tail -120 /tmp/build2.log 2>/dev/null || tail -120 /tmp/build1.log
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "=== 错误摘要 ==="
            grep -aiE "ERROR: package|failed to build|Error [0-9]+" /tmp/build1.log /tmp/build2.log 2>/dev/null | tail -30
            exit 1
          fi
          set -e

          echo "=== image size check ==="
          for f in bin/targets/ramips/mt7620/*sysupgrade.bin; do
            [ -f "$f" ] && echo "$(stat -c%s "$f")  $(basename "$f")"
          done
          echo "=== ccache stats ==="
          ccache --show-stats || true

      - name: Collect artifacts
        run: |
          cd openwrt
          mkdir -p ../output
          cp bin/targets/ramips/mt7620/*.bin ../output/ 2>/dev/null || true
          cp bin/targets/ramips/mt7620/*.manifest ../output/ 2>/dev/null || true
          cp bin/targets/ramips/mt7620/sha256sums ../output/ 2>/dev/null || true
          cp bin/targets/ramips/mt7620/config.buildinfo ../output/ 2>/dev/null || true
          cp bin/targets/ramips/mt7620/feeds.buildinfo ../output/ 2>/dev/null || true
          cp bin/targets/ramips/mt7620/profiles.json ../output/ 2>/dev/null || true
          cp bin/targets/ramips/mt7620/version.buildinfo ../output/ 2>/dev/null || true
          ls -la ../output

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: FanchmWrt-K2-${{ steps.params.outputs.device }}${{ steps.params.outputs.with_ss_full == 'true' && '-full' || (steps.params.outputs.with_ssrplus == 'true' && '-ssrplus' || (steps.params.outputs.with_xray == 'true' && '-xray' || '')) }}
          path: output/*
          retention-days: 30

      # ---- 保存缓存（只在启用且未命中时写入）----
      - name: Save download cache
        if: steps.params.outputs.use_dl == 'true' && steps.cache-dl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl
          key: dl-${{ steps.params.outputs.device }}-${{ steps.params.outputs.cfg_hash }}

      - name: Save ccache
        if: steps.params.outputs.use_ccache == 'true' && steps.cache-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ steps.params.outputs.device }}-${{ steps.params.outputs.cfg_hash }}
