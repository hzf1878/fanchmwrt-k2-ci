name: Build FanchmWrt for Phicomm K2

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device'
        required: true
        default: 'k2-16m'
        type: choice
        options:
          - k2-16m
          - k2-32m
          - k2-8m
      use_cache:
        description: 'Use build cache (dl + ccache, saves ~55min)'
        required: true
        default: true
        type: boolean
      use_ccache:
        description: 'Use ccache only (kernel/package object cache, saves ~35min)'
        required: true
        default: true
        type: boolean
      with_xray:
        description: 'Include xray-core (trojan/VMess/VLESS/SS, ~1.2MB, needs 16M flash)'
        required: true
        default: false
        type: boolean
      with_ssrplus:
        description: 'Include luci-app-ssr-plus GUI (needs with_xray, ~2MB, 16M flash only)'
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

env:
  REPO_URL: https://github.com/fanchmwrt/fanchmwrt.git
  REPO_BRANCH: fanchmwrt-25.12.6
  TZ: Asia/Shanghai
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build parameters
        id: params
        run: |
          DEVICE="${{ github.event.inputs.device }}"
          if [ -z "$DEVICE" ]; then DEVICE="k2-16m"; fi
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          CFG_HASH=$(sha256sum "config/$DEVICE.config" | cut -c1-16)
          echo "cfg_hash=$CFG_HASH" >> "$GITHUB_OUTPUT"

          # use_cache 总开关（未提供时默认 true，tag 触发也走缓存）
          USE_CACHE="${{ github.event.inputs.use_cache }}"
          if [ -z "$USE_CACHE" ]; then USE_CACHE="true"; fi
          # use_ccache 细粒度开关
          USE_CCACHE="${{ github.event.inputs.use_ccache }}"
          if [ -z "$USE_CCACHE" ]; then USE_CCACHE="$USE_CACHE"; fi
          # 总开关关闭时，ccache 也强制关闭
          if [ "$USE_CACHE" != "true" ]; then USE_CCACHE="false"; fi

          echo "use_cache=$USE_CACHE" >> "$GITHUB_OUTPUT"
          echo "use_ccache=$USE_CCACHE" >> "$GITHUB_OUTPUT"
          # 下载缓存依赖总开关
          if [ "$USE_CACHE" = "true" ]; then
            echo "use_dl=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_dl=false" >> "$GITHUB_OUTPUT"
          fi

          # xray：默认不装；8M 设备强制关闭（空间不够）
          WITH_XRAY="${{ github.event.inputs.with_xray }}"
          if [ -z "$WITH_XRAY" ]; then WITH_XRAY="false"; fi
          if [ "$WITH_XRAY" = "true" ] && [ "$DEVICE" = "k2-8m" ]; then
            echo "::warning::xray-core 需要约 4MB，k2-8m 的可写区放不下，已自动关闭"
            WITH_XRAY="false"
          fi

          # ssr-plus：依赖 xray-core，8M 不可用；16M 空间也不足（实测超限 4.8MB）
          WITH_SSRPLUS="${{ github.event.inputs.with_ssrplus }}"
          if [ -z "$WITH_SSRPLUS" ]; then WITH_SSRPLUS="false"; fi
          if [ "$WITH_SSRPLUS" = "true" ] && [ "$DEVICE" = "k2-8m" ]; then
            echo "::warning::luci-app-ssr-plus 约 20MB，k2-8m 放不下，已自动关闭"
            WITH_SSRPLUS="false"
          fi
          if [ "$WITH_SSRPLUS" = "true" ] && [ "$DEVICE" = "k2-16m" ]; then
            echo "::warning::实测 ssr-plus + xray 镜像约 20.3MB，超过 16M 分区上界 15.69MB"
            echo "::warning::16M 上编出来会没有 sysupgrade.bin，建议改用 k2-32m"
          fi
          if [ "$WITH_SSRPLUS" = "true" ] && [ "$WITH_XRAY" != "true" ]; then
            echo "::warning::ssr-plus 需要 xray-core，已自动开启 with_xray"
            WITH_XRAY="true"
          fi

          echo "with_xray=$WITH_XRAY" >> "$GITHUB_OUTPUT"
          echo "with_ssrplus=$WITH_SSRPLUS" >> "$GITHUB_OUTPUT"

          echo "Device        : $DEVICE"
          echo "Config hash   : $CFG_HASH"
          echo "use_cache     : $USE_CACHE"
          echo "use_dl        : $([ "$USE_CACHE" = "true" ] && echo true || echo false)"
          echo "use_ccache    : $USE_CCACHE"
          echo "with_xray     : $WITH_XRAY"
          echo "with_ssrplus  : $WITH_SSRPLUS"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache ecj fastjar file g++ gawk gettext git \
            java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev \
            libssl-dev python3 python3-setuptools python3-dev \
            rsync subversion swig time xsltproc zlib1g-dev unzip wget

      - name: Clone upstream source
        run: |
          git clone --depth=1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          echo "Upstream commit: $(git log --oneline -1)"

      # ---- 缓存 1：下载的软件包源码（省 ~20 分钟）----
      - name: Restore download cache
        id: cache-dl
        if: steps.params.outputs.use_dl == 'true'
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl
          key: dl-${{ steps.params.outputs.device }}-${{ steps.params.outputs.cfg_hash }}
          restore-keys: |
            dl-${{ steps.params.outputs.device }}-
            dl-

      # ---- 缓存 2：ccache 编译缓存（省 ~35 分钟）----
      # 注意：OpenWrt 默认把 ccache 放在 $(TOPDIR)/.ccache，即 openwrt/.ccache
      - name: Restore ccache
        id: cache-ccache
        if: steps.params.outputs.use_ccache == 'true'
        uses: actions/cache/restore@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ steps.params.outputs.device }}-${{ steps.params.outputs.cfg_hash }}
          restore-keys: |
            ccache-${{ steps.params.outputs.device }}-
            ccache-

      - name: Cache status
        run: |
          echo "=== Cache switch ==="
          echo "use_cache  : ${{ steps.params.outputs.use_cache }}"
          echo "use_dl     : ${{ steps.params.outputs.use_dl }}"
          echo "use_ccache : ${{ steps.params.outputs.use_ccache }}"
          echo
          if [ "${{ steps.params.outputs.use_dl }}" = "true" ]; then
            echo "dl cache hit     : ${{ steps.cache-dl.outputs.cache-hit }}"
            du -sh openwrt/dl 2>/dev/null || echo "dl: empty"
          else
            echo "dl cache         : disabled"
          fi
          if [ "${{ steps.params.outputs.use_ccache }}" = "true" ]; then
            echo "ccache cache hit : ${{ steps.cache-ccache.outputs.cache-hit }}"
            du -sh openwrt/.ccache 2>/dev/null || echo "ccache: empty"
          else
            echo "ccache cache     : disabled"
          fi

      - name: Apply custom patches
        run: |
          cd openwrt
          cp ../patches/mt7620a_phicomm_k2-16m.dts target/linux/ramips/dts/
          cp ../patches/mt7620a_phicomm_k2-32m.dts target/linux/ramips/dts/
          python3 ../scripts/register_device.py
          echo "=== registered devices ==="
          grep -E "define Device/phicomm_k2-(16m|32m)" target/linux/ramips/image/mt7620.mk

      - name: Add third-party feeds
        run: |
          cd openwrt
          if [ "${{ steps.params.outputs.with_ssrplus }}" = "true" ]; then
            # xray-core 由 openwrt/packages 提供，helloworld 里的同名包会造成冲突
            # 只取其 luci-app-ssr-plus 及必要依赖，剔除其自带的 xray-core
            echo "src-git helloworld https://github.com/fw876/helloworld.git" >> feeds.conf.default
            echo "=== feeds.conf.default ==="
            cat feeds.conf.default
          else
            echo "ssr-plus disabled, skip extra feed"
          fi

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          if [ "${{ steps.params.outputs.with_ssrplus }}" = "true" ]; then
            echo "=== ssr-plus 是否可装 ==="
            ./scripts/feeds list -n 2>/dev/null | grep -i "ssr-plus" || echo "未找到 ssr-plus"
          fi

      - name: Load build config
        run: |
          cd openwrt
          cp ../config/${{ steps.params.outputs.device }}.config .config

          # ccache 需要 CONFIG_DEVEL=y，否则 config CCACHE 的 "if DEVEL" 条件不成立
          # 该选项会被 defconfig 直接丢弃，ccache 完全不会生效
          sed -i '/^CONFIG_CCACHE=/d' .config
          sed -i '/^# CONFIG_CCACHE is not set/d' .config
          sed -i '/^CONFIG_DEVEL=/d' .config
          sed -i '/^# CONFIG_DEVEL is not set/d' .config
          if [ "${{ steps.params.outputs.use_ccache }}" = "true" ]; then
            echo 'CONFIG_DEVEL=y' >> .config
            echo 'CONFIG_CCACHE=y' >> .config
            echo "ccache: enabled (with CONFIG_DEVEL)"
          else
            echo '# CONFIG_DEVEL is not set' >> .config
            echo '# CONFIG_CCACHE is not set' >> .config
            echo "ccache: disabled"
          fi

          # xray-core 开关
          sed -i '/^CONFIG_PACKAGE_xray-core=/d' .config
          sed -i '/^# CONFIG_PACKAGE_xray-core is not set/d' .config
          if [ "${{ steps.params.outputs.with_xray }}" = "true" ]; then
            echo 'CONFIG_PACKAGE_xray-core=y' >> .config
            echo "xray-core: enabled"
          else
            echo '# CONFIG_PACKAGE_xray-core is not set' >> .config
            echo "xray-core: disabled"
          fi

          # ssr-plus 与 feeds 管理
          if [ "${{ steps.params.outputs.with_ssrplus }}" = "true" ]; then
            python3 ../scripts/configure_ssrplus.py enable
          else
            python3 ../scripts/configure_ssrplus.py disable
          fi

          make defconfig
          echo "=== Target ==="
          grep -E '^CONFIG_TARGET_PROFILE' .config
          echo "=== ccache ==="
          grep -E '^CONFIG_CCACHE' .config || echo "CONFIG_CCACHE not set"
          echo "=== xray ==="
          grep -E '^CONFIG_PACKAGE_xray-core' .config || echo "xray-core not in config"
          echo "=== ssr-plus ==="
          grep -E '^CONFIG_PACKAGE_luci-app-ssr-plus' .config || echo "ssr-plus not in config"

          echo "=== 体积相关的包（defconfig 之后）==="
          for p in mihomo hysteria naiveproxy shadowsocks-rust shadowsocks-libev \
                   shadowsocksr-libev mosdns chinadns-ng dnsproxy tuic-client upx \
                   v2raya xray-plugin v2ray-core v2ray-plugin simple-obfs redsocks2 \
                   shadow-tls dns2socks dns2socks-rust ipt2socks-rs gn tcping; do
            if grep -qE "^CONFIG_PACKAGE_$p=y" .config; then
              echo "  $p = ON"
            fi
          done
          echo "=== 上面若出现 ON，说明它会被编入固件 ==="

          ccache --version | head -1

      - name: Download package sources
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s
          find dl -size -1024c -exec rm -f {} \;
          echo "download dir: $(du -sh dl | cut -f1)"

      - name: Compile firmware
        run: |
          cd openwrt

          # 强制重建 rootfs 与镜像，避免 build_dir 残留导致镜像字节不变
          rm -rf build_dir/target-*/root-*/
          rm -rf build_dir/target-*/linux-*/root.squashfs*
          rm -rf build_dir/target-*/linux-*/tmp
          rm -rf build_dir/target-*/linux-*/*-kernel.bin
          rm -rf bin/targets/ramips/mt7620/*.bin
          rm -rf bin/targets/ramips/mt7620/*.manifest
          echo "=== cleaned rootfs artifacts ==="

          make -j$(nproc) || make -j1 V=s

          echo "=== image size check ==="
          for f in bin/targets/ramips/mt7620/*sysupgrade.bin; do
            [ -f "$f" ] && echo "$(stat -c%s "$f")  $(basename "$f")"
          done
          echo "=== ccache stats ==="
          ccache --show-stats || true

      - name: Collect artifacts
        run: |
          cd openwrt
          mkdir -p ../output
          cp bin/targets/ramips/mt7620/*.bin ../output/ 2>/dev/null || true
          cp bin/targets/ramips/mt7620/*.manifest ../output/ 2>/dev/null || true
          cp bin/targets/ramips/mt7620/sha256sums ../output/ 2>/dev/null || true
          cp bin/targets/ramips/mt7620/config.buildinfo ../output/ 2>/dev/null || true
          cp bin/targets/ramips/mt7620/feeds.buildinfo ../output/ 2>/dev/null || true
          cp bin/targets/ramips/mt7620/profiles.json ../output/ 2>/dev/null || true
          cp bin/targets/ramips/mt7620/version.buildinfo ../output/ 2>/dev/null || true
          ls -la ../output

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: FanchmWrt-K2-${{ steps.params.outputs.device }}${{ steps.params.outputs.with_ssrplus == 'true' && '-ssrplus' || (steps.params.outputs.with_xray == 'true' && '-xray' || '') }}
          path: output/*
          retention-days: 30

      # ---- 保存缓存（只在启用且未命中时写入）----
      - name: Save download cache
        if: steps.params.outputs.use_dl == 'true' && steps.cache-dl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl
          key: dl-${{ steps.params.outputs.device }}-${{ steps.params.outputs.cfg_hash }}

      - name: Save ccache
        if: steps.params.outputs.use_ccache == 'true' && steps.cache-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ steps.params.outputs.device }}-${{ steps.params.outputs.cfg_hash }}
